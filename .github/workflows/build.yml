name: APK Build

on:
  pull_request: {}
  push:
    branches: [ main, develop ]

env:
  # Gradle 构建参数（内存优化 + 兼容性）
  GRADLE_OPTS: >
    -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g"
    -Dkotlin.daemon.jvm.options="-Xmx2560m"
    -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon --warning-mode all

jobs:
  debug:
    name: Build debug APKs (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [ Gplay, Fdroid ]
    concurrency:
      group: ${{ format('build-debug-{0}-{1}', matrix.target, github.ref) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Assemble ${{ matrix.target }} debug apk
        run: ./gradlew assemble${{ matrix.target }}Debug $CI_GRADLE_ARG_PROPERTIES

      - name: Upload ${{ matrix.target }} debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: vector-${{ matrix.target }}-debug
          path: |
            vector-app/build/outputs/apk/*/debug/*.apk

  release:
    name: Build unsigned GPlay APKs
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ format('build-release-apk-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Assemble GPlay unsigned apk
        run: ./gradlew clean assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Upload Gplay unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: vector-gplay-release-unsigned
          path: |
            vector-app/build/outputs/apk/*/release/*.apk

  exodus:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Obtain apk from artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: vector-gplay-release-unsigned

      - name: Show apks in artifact
        run: ls -R ${{steps.download.outputs.download-path}}

      - name: Execute exodus-standalone
        uses: docker://exodusprivacy/exodus-standalone:latest
        with:
          args: /github/workspace/gplay/release/vector-gplay-universal-release-unsigned.apk -j -o /github/workspace/exodus.json -e 0

      - name: Upload exodus json report
        uses: actions/upload-artifact@v4
        with:
          name: exodus.json
          path: |
            exodus.json

      - name: Check for trackers
        env:
          SENTRY_ID: 447
        run: |
          TRACKER_IDS=$(jq ".trackers[] | .id" exodus.json)
          [ "$TRACKER_IDS" = "${{ env.SENTRY_ID }}" ] || { echo '::error static analysis identified user tra
